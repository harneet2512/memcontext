[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memcontext"
version = "0.2.0"
description = "Domain-agnostic memory and context substrate — claim lifecycle, supersession, projections, retrieval, trust & governance"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "structlog>=24.0",
    "click>=8.0",
]

[project.optional-dependencies]
# Semantic retrieval + Pass-2 supersession. Without this extra (or
# MODAL_BGE_M3_URL) MemContext runs in lexical-only mode and says so.
embeddings = [
    "FlagEmbedding>=1.2.10",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "requests>=2.28",
]
# MCP server: stdio transport + Streamable HTTP (+ OAuth) for remote clients.
mcp = [
    "mcp>=1.0,<2.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
]
# REST API + ambient hook endpoints (memcontext serve-http).
http = [
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn>=0.30",
]
# `memcontext share` / `serve-http --share` outbound tunnel.
share = [
    "pycloudflared>=0.3",
]
# Complete test + lint + typecheck environment. Includes mcp/http deps because
# the suite covers both transports.
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "pyright>=1.1",
    "mcp>=1.0,<2.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "fastapi>=0.110",
    "pydantic>=2.0",
    "httpx>=0.27",
]
all = [
    "FlagEmbedding>=1.2.10",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "requests>=2.28",
    "mcp>=1.0,<2.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "fastapi>=0.110",
    "pydantic>=2.0",
    "pycloudflared>=0.3",
]

[project.scripts]
memcontext = "memcontext.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["memcontext"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# E501 off: the codebase intentionally keeps long literal lines (MCP tool
# schemas, SQL, log strings); enforcing a hard wrap adds churn, not clarity.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Smoke scripts bootstrap sys.path / print headers before imports by design.
"scripts/**" = ["E402"]

[tool.pyright]
# The gate CI enforces is the shippable package. evals/ is the benchmark
# instrument (imports the external `memory_bench` trial package, which is not a
# declared dependency and cannot resolve in a clean install); scripts/ and
# tests/ are covered by ruff.
typeCheckingMode = "basic"
pythonVersion = "3.11"
include = ["memcontext"]
